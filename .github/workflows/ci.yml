name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate governance files, CODEOWNERS, and YAML issue templates
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          required = [
              "AGENTS.md",
              "CODE_OF_CONDUCT.md",
              "CONTRIBUTING.md",
              "GOVERNANCE.md",
              "SECURITY.md",
              "profile/README.md",
              ".github/CODEOWNERS",
              ".github/PULL_REQUEST_TEMPLATE.md",
              ".github/ISSUE_TEMPLATE/config.yml",
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              ".github/ISSUE_TEMPLATE/feature_request.yml",
              ".github/ISSUE_TEMPLATE/subplatform_package.yml",
              ".github/ISSUE_TEMPLATE/translation_review.yml",
          ]
          for rel in required:
              p = Path(rel)
              assert p.is_file() and p.stat().st_size > 0, f"Missing or empty required file: {rel}"

          codeowners_rules = [
              line.strip()
              for line in Path(".github/CODEOWNERS").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          assert any(
              line.startswith("*") and "@sadikkuzu" in line and "@ozdil" in line
              for line in codeowners_rules
          ), "CODEOWNERS must contain a non-comment '*' rule listing both @sadikkuzu and @ozdil"

          gov = Path("GOVERNANCE.md").read_text(encoding="utf-8")
          assert "@sadikkuzu" in gov and "@ozdil" in gov, "GOVERNANCE.md must list both Core Maintainers"

          for yml_path in sorted(Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              data = yaml.safe_load(yml_path.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and data, f"Invalid YAML in {yml_path}"
              if yml_path.name != "config.yml":
                  for req_key in ("name", "description", "body"):
                      assert data.get(req_key), f"Issue form {yml_path} missing required key: {req_key}"
                  assert isinstance(data["body"], list) and data["body"], (
                      f"Issue form {yml_path} 'body' must be a non-empty list"
                  )

          print("All organization governance files, CODEOWNERS, and YAML templates validated.")
          PY
